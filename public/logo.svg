<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1450 340"
     role="img"
     aria-labelledby="title description">
  <title id="title">Nautilus Engenharia Naval</title>
  <desc id="description">Logomarca institucional oficial da Nautilus Engenharia Naval</desc>
  <defs>
    <linearGradient id="nautilusN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08285f" />
      <stop offset="0.55" stop-color="#061b48" />
      <stop offset="1" stop-color="#020d28" />
    </linearGradient>
    <linearGradient id="nautilusWave" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0" stop-color="#2638d7" />
      <stop offset="0.62" stop-color="#3445d9" />
      <stop offset="1" stop-color="#2145a8" />
    </linearGradient>
  </defs>

  <!-- Símbolo vetorial redesenhado a partir da marca oficial fornecida. -->
  <path d="M20 20h92l164 139V20h88v222c-32 0-62-5-88-14L112 92v82H20z" fill="url(#nautilusN)" />
  <path d="M20 181c103-9 181 74 390 78-39 12-67 32-99 59H76z" fill="url(#nautilusWave)" />

